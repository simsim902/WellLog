{% extends 'base.html' %}
{% block title %}기록 삭제 - WellLog{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>정말 삭제할까요?</h2>
  <p>{{ log.date|date:"Y년 n월 j일" }} · {{ log.get_score_display }}</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn danger">삭제</button>
    <a href="{% url 'log_list' %}">취소</a>
  </form>
</div>
{% endblock %}
