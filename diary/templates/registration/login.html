{% extends 'base.html' %}
{% block title %}로그인 - WellLog{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>로그인</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-block">로그인</button>
  </form>
  <p class="alt-link">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</div>
{% endblock %}
