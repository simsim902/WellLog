{% extends 'base.html' %}
{% block title %}회원가입 - WellLog{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>회원가입</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-block">가입하기</button>
  </form>
  <p class="alt-link">이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a></p>
</div>
{% endblock %}
